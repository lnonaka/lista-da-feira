<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2F6B4F">
  <title>Lista da Feira</title>
  <style>
    :root{--bg:#F3F1E6;--surface:#fff;--surface2:#FBFAF5;--ink:#23241D;--soft:#6E6C5C;--border:#E2DDC9;--accent:#2F6B4F;--danger:#A23B3B;--gold:#A6791F;--goldsoft:#F5E9D2}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:20px 16px 28px}
    .app{max-width:520px;margin:auto;display:flex;flex-direction:column;gap:14px}
    h1{margin:0;font-size:28px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
    .sub{margin:3px 0 0;color:var(--soft);font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
    .offline .dot{background:var(--danger)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 24px -12px #0002}
    form{padding:12px;display:grid;grid-template-columns:1fr 92px;gap:8px}
    input{width:100%;border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:12px;font:inherit;font-size:16px;color:var(--ink)}
    #name{grid-column:1/-1} button{font:inherit;font-weight:700;cursor:pointer}
    .add{background:var(--accent);color:white;border:0;border-radius:10px}.add:disabled{opacity:.5}
    .qty{max-width:150px}.bar{display:none;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--goldsoft);border:1px solid var(--border);border-radius:12px;font-size:13px}
    .bar.show{display:flex}.clear{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:8px;padding:7px 10px}
    ul{list-style:none;margin:0;padding:0;overflow:hidden}.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px dashed var(--border);cursor:pointer}
    .item:last-child{border-bottom:0}.box{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;display:grid;place-items:center;flex:none}
    .box:after{content:"✓";font-weight:900;color:white;opacity:0;transform:scale(.6)}.checked .box{background:var(--accent);border-color:var(--accent)}.checked .box:after{opacity:1;transform:scale(1)}
    .main{flex:1;min-width:0}.name{overflow-wrap:anywhere}.checked .name{text-decoration:line-through;color:var(--soft)}
    .qtytag{font-size:11px;color:var(--gold);background:var(--goldsoft);border-radius:999px;padding:3px 8px;margin-left:7px}
    .remove{width:30px;height:30px;border:0;background:transparent;color:var(--soft);font-size:18px}.remove:hover{color:var(--danger)}
    .empty{text-align:center;color:var(--soft);padding:38px 20px}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:7px}
    .banner{display:none;padding:11px 13px;border-radius:12px;background:#fff3cd;border:1px solid #e4d59b;font-size:13px}.banner.show{display:block}
    .room{padding:10px 12px;font-size:12px;color:var(--soft);display:flex;gap:8px;align-items:center}.room code{font-weight:700;color:var(--ink)}
    footer{text-align:center;color:var(--soft);font-size:12px}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">Lista compartilhada</div>
    <h1>Lista da Feira</h1>
    <p class="sub" id="status"><span class="dot"></span>Conectando…</p>
  </header>

  <div class="card room">Lista: <code id="room"></code></div>
  <div class="banner" id="banner"></div>

  <form class="card" id="form">
    <input id="name" placeholder="Produto (ex.: leite, tomate)" maxlength="120" autocomplete="off" required>
    <input id="qty" class="qty" placeholder="Qtd" maxlength="30" autocomplete="off">
    <button class="add" id="add" type="submit">+ Adicionar</button>
  </form>

  <div class="bar" id="bar">
    <span><b id="count">0</b> no carrinho</span>
    <button class="clear" id="clear" type="button">Limpar comprados</button>
  </div>

  <div class="card">
    <ul id="list"></ul>
    <div class="empty" id="empty"><strong>Sua lista está vazia</strong>Adicione o primeiro produto acima.</div>
  </div>

  <footer>Marque o produto quando ele estiver no carrinho. A alteração aparece para os dois em tempo real.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/*
  1) Crie um projeto no Supabase.
  2) Rode o SQL fornecido abaixo pelo assistente.
  3) Substitua SUPABASE_URL e SUPABASE_ANON_KEY.
*/
const SUPABASE_URL = "https://waqgnlwuhiqrlrifhvdc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_BtMh8IByUaM3ih4sJ8vbuQ_jI__B39y";

const params = new URLSearchParams(location.search);
let room = params.get("lista");
if (!room) {
  room = localStorage.getItem("lista-feira-room") || "familia";
  history.replaceState(null, "", "?lista=" + encodeURIComponent(room));
}
localStorage.setItem("lista-feira-room", room);
document.getElementById("room").textContent = room;

const statusEl = document.getElementById("status");
const bannerEl = document.getElementById("banner");
const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const form = document.getElementById("form");
const nameEl = document.getElementById("name");
const qtyEl = document.getElementById("qty");
const addBtn = document.getElementById("add");
const bar = document.getElementById("bar");
const countEl = document.getElementById("count");
const clearBtn = document.getElementById("clear");

let client = null;
let items = [];

function banner(msg){ bannerEl.textContent = msg; bannerEl.classList.add("show"); }
function hideBanner(){ bannerEl.classList.remove("show"); }
function status(text, offline=false){
  statusEl.classList.toggle("offline", offline);
  statusEl.innerHTML = '<span class="dot"></span>' + text;
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function render(){
  const ordered = [...items].sort((a,b)=>(a.checked-b.checked) || (new Date(a.created_at)-new Date(b.created_at)));
  listEl.innerHTML = ordered.map(i => `
    <li class="item ${i.checked ? "checked":""}" data-id="${i.id}">
      <span class="box"></span>
      <span class="main"><span class="name">${esc(i.name)}</span>${i.qty ? `<span class="qtytag">${esc(i.qty)}</span>`:""}</span>
      <button class="remove" type="button" data-remove="${i.id}" aria-label="Remover ${esc(i.name)}">×</button>
    </li>`).join("");
  emptyEl.style.display = ordered.length ? "none" : "block";
  const checked = items.filter(i=>i.checked).length;
  countEl.textContent = checked;
  bar.classList.toggle("show", checked > 0);
}

async function load(){
  const {data,error} = await client.from("shopping_items").select("*").eq("room_id",room).order("created_at",{ascending:true});
  if(error) throw error;
  items = data || [];
  render();
}

async function addItem(name, qty){
  const {error} = await client.from("shopping_items").insert({room_id:room,name,qty:qty||"",checked:false});
  if(error) throw error;
}
async function toggle(id){
  const item = items.find(x=>x.id===id); if(!item) return;
  const {error}=await client.from("shopping_items").update({checked:!item.checked}).eq("id",id).eq("room_id",room);
  if(error) throw error;
}
async function removeItem(id){
  const {error}=await client.from("shopping_items").delete().eq("id",id).eq("room_id",room);
  if(error) throw error;
}
async function clearBought(){
  const {error}=await client.from("shopping_items").delete().eq("room_id",room).eq("checked",true);
  if(error) throw error;
}

form.addEventListener("submit", async e=>{
  e.preventDefault();
  const name=nameEl.value.trim(); const qty=qtyEl.value.trim();
  if(!name || !client) return;
  addBtn.disabled=true;
  try{
    await addItem(name,qty);
    nameEl.value=""; qtyEl.value=""; nameEl.focus();
  }catch(err){ console.error(err); banner("Não foi possível adicionar. Verifique o Supabase e as políticas RLS."); }
  finally{ addBtn.disabled=false; }
});

listEl.addEventListener("click", async e=>{
  const remove=e.target.closest("[data-remove]");
  const item=e.target.closest("[data-id]");
  try{
    if(remove){ e.stopPropagation(); await removeItem(remove.dataset.remove); }
    else if(item){ await toggle(item.dataset.id); }
  }catch(err){ console.error(err); banner("Não foi possível atualizar este item."); }
});

clearBtn.addEventListener("click", async ()=>{
  clearBtn.disabled=true;
  try{ await clearBought(); }catch(err){ console.error(err); banner("Não foi possível limpar os comprados."); }
  finally{ clearBtn.disabled=false; }
});

async function boot(){
  if(SUPABASE_URL.startsWith("COLE_") || SUPABASE_ANON_KEY.startsWith("COLE_")){
    status("Configure o Supabase",true);
    banner("Abra o arquivo e preencha SUPABASE_URL e SUPABASE_ANON_KEY.");
    return;
  }
  client = supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  try{
    await load();
    status("Sincronizado em tempo real");
    hideBanner();

    client.channel("shopping-" + room)
      .on("postgres_changes",
          {event:"*",schema:"public",table:"shopping_items",filter:"room_id=eq."+room},
          async ()=>{ await load(); })
      .subscribe((state)=>{
        if(state==="SUBSCRIBED") status("Sincronizado em tempo real");
        else if(state==="CHANNEL_ERROR" || state==="TIMED_OUT") status("Reconectando…",true);
      });
  }catch(err){
    console.error(err);
    status("Erro de conexão",true);
    banner("Erro: " + (err.message || "verifique a configuração do Supabase."));
  }
}
boot();
</script>
</body>
</html>
